<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Prep Notes — Study Workspace</title>
  <meta name="description" content="A focused workspace for interview preparation notes, code, and study materials.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@300;400;500;600;700&family=Kalam:wght@300;400;700&display=swap"
    rel="stylesheet">

  <!-- Prism.js for syntax highlighting (Monokai theme) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css"
    rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">

  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4874d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/%3E%3Cpath d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/%3E%3C/svg%3E">
</head>

<body>
  <div class="app-container" id="app">

    <!-- ─── SIDEBAR ─── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span class="sidebar-title-mark"></span> Library
        </div>
        <div class="sidebar-stats" id="sidebar-stats"></div>
      </div>
      <div class="file-tree-container" id="file-tree"></div>
    </aside>

    <!-- ─── MAIN ─── -->
    <div class="main-content">

      <!-- ─── HEADER ─── -->
      <header class="header">
        <button class="btn-icon" id="toggle-sidebar" title="Toggle Sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

        <div class="header-logo">
          <span class="logo-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
          </span>
          <div>
            <h1>Interview Prep</h1>
            <div class="subtitle">Personal study workspace</div>
          </div>
        </div>

        <div class="search-container">
          <span class="search-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </span>
          <input type="text" class="search-input" id="search-input" placeholder="Search your workspace...">
          <div class="search-results" id="search-results"></div>
        </div>

        <div class="header-actions">
          <!-- Font size controls -->
          <div class="font-size-controls">
            <button class="font-size-btn" id="font-decrease" title="Decrease font size">A−</button>
            <span class="font-size-label" id="font-size-label">16</span>
            <button class="font-size-btn" id="font-increase" title="Increase font size">A+</button>
          </div>

          <!-- Theme switcher -->
          <div class="theme-dropdown">
            <button class="btn-icon" id="theme-toggle" title="Switch theme">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 3a9 9 0 0 0 0 18v-18z" fill="currentColor" />
              </svg>
            </button>
            <div class="theme-menu" id="theme-menu">
              <button class="theme-option active" data-theme="paper">
                <span class="theme-swatch" style="background:#fdf8f0; border-color:#d4a56a;"></span>
                Paper Warm
              </button>
              <button class="theme-option" data-theme="sepia">
                <span class="theme-swatch" style="background:#f4e8d1; border-color:#c09050;"></span>
                Sepia Soft
              </button>
              <button class="theme-option" data-theme="dark">
                <span class="theme-swatch" style="background:#1a1a2e; border-color:#6060b0;"></span>
                Midnight Dark
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- ─── BREADCRUMB ─── -->
      <div class="breadcrumb-bar" id="breadcrumb-bar">
        <span class="breadcrumb-item" data-path="">Workspace</span>
      </div>

      <!-- ─── CONTENT ─── -->
      <div class="content-area" id="content-area">
        <div class="content-inner" id="content-inner">
          <!-- Welcome screen -->
          <div class="welcome-screen" id="welcome-screen">
            <div class="welcome-icon">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                <line x1="9" y1="7" x2="15" y2="7" />
                <line x1="9" y1="11" x2="13" y2="11" />
              </svg>
            </div>
            <p class="welcome-eyebrow">YOUR KNOWLEDGE BASE</p>
            <h2 class="welcome-title">Ready when you are.</h2>
            <p class="welcome-subtitle">
              Select a note from your library to focus, learn, and build confidence.<br>
              Markdown, code, and images are all formatted for focused reading.
            </p>
            <div class="welcome-hint">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10" />
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
              </svg>
              <span>Your workspace updates automatically</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ─── FLOATING TOC BUTTON (Visible only for Markdown) ─── -->
    <button class="toc-floating-btn hidden" id="toggle-toc" title="Table of Contents">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6" />
        <line x1="8" y1="12" x2="21" y2="12" />
        <line x1="8" y1="18" x2="21" y2="18" />
        <line x1="3" y1="6" x2="3.01" y2="6" />
        <line x1="3" y1="12" x2="3.01" y2="12" />
        <line x1="3" y1="18" x2="3.01" y2="18" />
      </svg>
      <span>TOC</span>
    </button>

    <!-- ─── TABLE OF CONTENTS ─── -->
    <div class="toc-container hidden" id="toc-container"></div>

  </div>

  <!-- ─── TOAST CONTAINER ─── -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Prism.js core + languages -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-tsx.min.js"></script>

  <!-- Marked.js for markdown -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>

  <!-- Monaco Editor (VS Code engine) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

  <!-- App -->
  <script type="module" src="app.js"></script>
</body>

</html>
