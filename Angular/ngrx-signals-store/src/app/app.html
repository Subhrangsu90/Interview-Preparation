<!-- Reusable Header Component -->
<app-header [title]="title()" (toggleMenu)="toggleSidenav()" />

<!-- Sidenav Layout Container -->
<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav mode="side" [opened]="isSidenavOpened()">
    <!-- Reusable Sidenav Component -->
    <app-sidenav [navItems]="navItems()" />
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="main-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
