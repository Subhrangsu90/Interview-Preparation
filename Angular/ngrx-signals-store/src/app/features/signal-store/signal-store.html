<div class="signal-store-layout">
  <!-- Parent Page Header -->
  <header class="page-header">
    <div class="header-main">
      <div class="breadcrumb-container">
        <span class="crumb">Architecture</span>
        <mat-icon class="crumb-separator">chevron_right</mat-icon>
        <span class="crumb active">Signal Store</span>
      </div>
      <div class="title-row">
        <div class="title-group">
          <h1>NgRx SignalStore</h1>
          <span class="version-chip">v22 Signals</span>
        </div>
        <div class="header-actions">
          <a mat-stroked-button href="https://ngrx.io/guide/signals/signal-store" target="_blank"
            rel="noopener noreferrer">
            <mat-icon>open_in_new</mat-icon>
            Official Docs
          </a>
        </div>
      </div>
      <p class="header-desc">
        A composable, type-safe reactive state management library powered by native Angular Signals.
      </p>
    </div>

    <!-- Parent-Child Sub Navigation Tabs -->
    <nav class="feature-tabs" aria-label="Signal Store sub navigation">
      <a class="tab-link" [routerLink]="['/signal-store', { outlets: { 'signal-store': ['overview'] } }]"
        routerLinkActive="active-tab">
        <mat-icon>dashboard_customize</mat-icon>
        <span>Overview</span>
      </a>
      <a class="tab-link" [routerLink]="['/signal-store', { outlets: { 'signal-store': ['book-search'] } }]"
        routerLinkActive="active-tab">
        <mat-icon>menu_book</mat-icon>
        <span>Book Search (Core Concepts)</span>
      </a>
    </nav>
  </header>

  <!-- Child View Content Area -->
  <main class="page-content">
    <div class="secondary-view">
      <router-outlet name="signal-store" />
    </div>
  </main>
</div>
