<section class="dashboard-container" aria-label="Dashboard Welcome">
  <mat-card appearance="outlined" class="welcome-frame">
    <mat-card-header class="welcome-header">
      <div mat-card-avatar class="welcome-avatar">
        <mat-icon class="welcome-avatar-icon">waving_hand</mat-icon>
      </div>
      <mat-card-title class="welcome-title">Welcome to Generative UI</mat-card-title>
      <mat-card-subtitle class="welcome-subtitle">Workspace Overview</mat-card-subtitle>
    </mat-card-header>

    <mat-divider class="welcome-divider" />

    <mat-card-content class="welcome-content">
      <p class="welcome-description">
        Your workspace is ready. Use the navigation panel on the left to explore your application
        modules, configure settings, and manage your generative components.
      </p>
    </mat-card-content>
  </mat-card>
</section>
